<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — CA TRANS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="brand">CA TRANS<span>.</span></div>
      <div class="subtitle">Fiche de calcul convoi</div>

      {% if erreur %}
        <p class="statut erreur">{{ erreur }}</p>
      {% endif %}

      <form method="post" action="{{ url_for('login', next=request.args.get('next')) }}">
        <div class="field">
          <label for="username">Identifiant</label>
          <input id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">Mot de passe</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary login-submit">Se connecter</button>
      </form>
    </div>
  </div>
</body>
</html>
